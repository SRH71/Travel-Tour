apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-service
  namespace: travel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contact-service
  template:
    metadata:
      labels:
        app: contact-service
    spec:
      containers:
        - name: contact-service
          image: contact-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
            