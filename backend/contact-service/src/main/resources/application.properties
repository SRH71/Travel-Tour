
spring.application.name=contact-service

server.port=${PORT:8083}

# ===============================
# MySQL Database - Aiven
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Eureka Discovery Server
# ===============================
eureka.client.service-url.defaultZone=https://travel-tour-discovery-server.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info

