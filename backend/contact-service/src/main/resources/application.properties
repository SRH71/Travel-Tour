spring.application.name=contact-service



server.port=8083

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/travel_agency_contact_db?useSSL=false&serverTimezone=UTC

# spring.datasource.url=jdbc:mysql://localhost:3306/travel_agency_contact_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=***********
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Eureka
# ===============================
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true







# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
