spring.application.name=tour-service


server.port=8081

# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# eureka.instance.hostname=localhost
eureka.instance.hostname=tour-service

management.endpoints.web.exposure.include=health,info





# MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/spring_cloud
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/spring_cloud
spring.datasource.username=root
spring.datasource.password=************
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

