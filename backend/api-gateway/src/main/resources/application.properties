spring.application.name=api-gateway

server.port=8080

# Eureka
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.client.register-with-eureka=true
# eureka.client.fetch-registry=true
# eureka.instance.hostname=localhost


# Eureka
# eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.service-url.defaultZone=https://travel-tour-discovery-server.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=api-gateway

# Actuator
management.endpoints.web.exposure.include=health,info

# Spring Cloud Gateway + Eureka Discovery
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


# Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# CORS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Handle CORS preflight requests
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true


# Tour Service Route
spring.cloud.gateway.server.webflux.routes[1].id=tour-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://tour-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/tours/**



# Contact Service Route
spring.cloud.gateway.server.webflux.routes[2].id=contact-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://contact-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/contact/**

# Booking Service Route
spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/bookings/**


